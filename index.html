<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda — Rotina & Metas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12181B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#12181B;
    --panel:#1B2226;
    --panel-raised:#212A2F;
    --paper:#EDE6D6;
    --muted:#93A099;
    --brass:#C9A227;
    --brass-dim:rgba(201,162,39,0.18);
    --alta:#E2725B;
    --media:#D9A441;
    --baixa:#7A9E7E;
    --lembrete:#5C8FD6;
    --line:rgba(201,162,39,0.14);
    --display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);min-height:100vh;}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;letter-spacing:0.2px;color:var(--paper);}
  .date{font-family:var(--mono);color:var(--brass);font-size:0.85rem;text-transform:uppercase;letter-spacing:1.5px;}
  nav.tabs{display:flex;gap:2px;margin-bottom:26px;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content;}
  nav.tabs button{font-family:var(--mono);font-size:0.78rem;letter-spacing:1px;text-transform:uppercase;background:var(--panel);color:var(--muted);border:none;padding:10px 20px;cursor:pointer;transition:background .15s, color .15s;}
  nav.tabs button.active{background:var(--brass-dim);color:var(--brass);}
  nav.tabs button:hover{color:var(--paper);}
  section{display:none;}
  section.active{display:block;}

  /* ---- spine timeline (reused for Hoje + dia do calendário) ---- */
  .spine-wrap{position:relative;padding-left:78px;}
  .spine-line{position:absolute;left:56px;top:6px;bottom:6px;width:1px;background:linear-gradient(var(--brass), var(--line) 90%);opacity:0.5;}
  .slot{position:relative;min-height:58px;display:flex;align-items:flex-start;margin-bottom:2px;}
  .slot .time{position:absolute;left:-78px;top:2px;width:56px;text-align:right;font-family:var(--mono);font-size:0.72rem;color:var(--muted);letter-spacing:0.5px;}
  .slot .tick{position:absolute;left:53px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--brass);opacity:0.6;}
  .task-card{flex:1;margin-left:16px;margin-bottom:12px;background:var(--panel);border-radius:8px;padding:12px 14px;border-left:3px solid var(--baixa);display:flex;align-items:center;gap:10px;}
  .task-card.p-alta{border-left-color:var(--alta);}
  .task-card.p-media{border-left-color:var(--media);}
  .task-card.p-baixa{border-left-color:var(--baixa);}
  .task-card.p-lembrete{border-left-color:var(--lembrete);}
  .task-card.done{opacity:0.42;}
  .task-card.done .txt{text-decoration:line-through;}
  .task-card input[type=checkbox]{width:17px;height:17px;accent-color:var(--brass);cursor:pointer;flex-shrink:0;}
  .task-card .txt{flex:1;font-size:0.94rem;}
  .task-card .tag{font-family:var(--mono);font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:4px;flex-shrink:0;}
  .p-alta .tag{background:rgba(226,114,91,0.15);color:var(--alta);}
  .p-media .tag{background:rgba(217,164,65,0.15);color:var(--media);}
  .p-baixa .tag{background:rgba(122,158,126,0.15);color:var(--baixa);}
  .p-lembrete .tag{background:rgba(92,143,214,0.15);color:var(--lembrete);}
  .task-card .edit,.task-card .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;opacity:0;transition:opacity .15s;flex-shrink:0;}
  .task-card:hover .edit,.task-card:hover .del{opacity:0.7;}
  .task-card .edit:hover{color:var(--brass);}
  .task-card .del:hover{color:var(--alta);}
  .task-card.editing{background:var(--panel-raised);border:1px dashed var(--brass);}
  .task-edit-form{flex:1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .task-edit-form input[type=time],.task-edit-form select{background:var(--ink);border:1px solid var(--line);color:var(--paper);padding:6px 8px;border-radius:6px;font-family:var(--sans);font-size:0.82rem;}
  .task-edit-form input[type=text]{flex:1;min-width:120px;background:var(--ink);border:1px solid var(--line);color:var(--paper);padding:6px 10px;border-radius:6px;font-family:var(--sans);font-size:0.86rem;}
  .task-edit-form button{background:var(--brass);color:var(--ink);border:none;padding:6px 12px;border-radius:6px;font-weight:600;cursor:pointer;font-size:0.78rem;}
  .task-edit-form button.cancel{background:none;border:1px solid var(--line);color:var(--muted);}
  .empty-slot{color:var(--muted);font-size:0.8rem;font-style:italic;margin-left:16px;opacity:0.5;}

  /* ---- Foco do dia ---- */
  .focus-card{margin-bottom:20px;}
  .focus-label{font-family:var(--mono);font-size:0.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--brass);margin-bottom:10px;display:flex;align-items:center;gap:10px;}
  .focus-label .focus-time{color:var(--paper);font-size:0.8rem;letter-spacing:1px;}
  .focus-card .task-card{padding:20px 22px;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,0.35);border-left-width:4px;}
  .focus-card .task-card .txt{font-size:1.15rem;}
  .timeline-rest{opacity:0.6;}
  .focus-toggle-wrap{margin:-14px 0 18px 0;}
  .focus-toggle-wrap a{font-family:var(--mono);font-size:0.72rem;color:var(--muted);text-decoration:underline;cursor:pointer;letter-spacing:0.5px;}
  .focus-toggle-wrap a:hover{color:var(--brass);}

  .add-form{display:flex;gap:8px;flex-wrap:wrap;background:var(--panel-raised);padding:14px;border-radius:8px;margin:20px 0 30px 0;border:1px dashed var(--line);}
  .add-form input[type=time], .add-form input[type=date], .add-form select{background:var(--ink);border:1px solid var(--line);color:var(--paper);padding:8px 10px;border-radius:6px;font-family:var(--sans);font-size:0.85rem;}
  .add-form input[type=text]{flex:1;min-width:160px;background:var(--ink);border:1px solid var(--line);color:var(--paper);padding:8px 12px;border-radius:6px;font-family:var(--sans);font-size:0.9rem;}
  .add-form button{background:var(--brass);color:var(--ink);border:none;padding:8px 18px;border-radius:6px;font-weight:600;cursor:pointer;font-size:0.85rem;}
  .add-form button:hover{background:#DDB434;}
  .add-form button.cancel{background:none;border:1px solid var(--line);color:var(--muted);}
  .add-form button.cancel:hover{color:var(--alta);border-color:var(--alta);}
  .add-form .form-context{width:100%;font-family:var(--mono);font-size:0.7rem;color:var(--brass);letter-spacing:0.3px;margin-bottom:2px;}

  /* ---- Não classificado ---- */
  #unclassified-section{margin-bottom:22px;}
  .unclassified-heading{font-family:var(--mono);font-size:0.72rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .unclassified-card{background:var(--panel);border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;border-left:3px solid var(--line);}
  .unclassified-card .txt{flex:1;font-size:0.9rem;}
  .unclassified-card button{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.72rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;}
  .unclassified-card button.classify-btn{color:var(--brass);border-color:var(--brass);}
  .unclassified-card button.classify-btn:hover{background:var(--brass-dim);}
  .unclassified-card button.unclassified-del{border:none;font-size:1rem;padding:4px 8px;}
  .unclassified-card button.unclassified-del:hover{color:var(--alta);}

  /* ---- Captura rápida (FAB) ---- */
  .fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;background:var(--brass);color:var(--ink);border:none;font-size:1.8rem;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.4);z-index:50;display:flex;align-items:center;justify-content:center;}
  .fab:hover{background:#DDB434;}
  body.auth-locked .fab{display:none;}
  .qc-overlay{display:none;position:fixed;inset:0;background:rgba(18,24,27,0.75);z-index:90;align-items:center;justify-content:center;padding:20px;}
  .qc-overlay.open{display:flex;}
  .qc-modal{background:var(--panel-raised);border:1px solid var(--line);border-radius:10px;padding:24px;width:100%;max-width:380px;}
  .qc-title{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0 0 16px 0;color:var(--paper);}
  #qc-form input{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--paper);padding:10px 12px;border-radius:6px;font-family:var(--sans);font-size:0.92rem;box-sizing:border-box;}
  #qc-form input:focus{outline:none;border-color:var(--brass);}
  .qc-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .qc-actions button{padding:8px 16px;border-radius:6px;font-size:0.85rem;cursor:pointer;font-weight:600;}
  #qc-submit{background:var(--brass);color:var(--ink);border:none;}
  #qc-submit:hover{background:#DDB434;}
  .qc-actions button.cancel{background:none;border:1px solid var(--line);color:var(--muted);font-weight:400;}

  /* ---- Metas ---- */
  .goals-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media(max-width:720px){.goals-grid{grid-template-columns:1fr;}}
  .goal-col h2{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0 0 4px 0;color:var(--brass);}
  .goal-col .sub{font-size:0.72rem;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}
  .goal-item{background:var(--panel);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;}
  .goal-item input[type=checkbox]{margin-top:2px;accent-color:var(--brass);cursor:pointer;}
  .goal-item .txt{flex:1;font-size:0.88rem;line-height:1.35;}
  .goal-item.done .txt{text-decoration:line-through;opacity:0.5;}
  .goal-item .edit,.goal-item .del{background:none;border:none;color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s;}
  .goal-item:hover .edit,.goal-item:hover .del{opacity:0.6;}
  .goal-item .edit:hover{color:var(--brass);}
  .goal-item .del:hover{color:var(--alta);}
  .goal-item.editing{background:var(--panel-raised);border:1px dashed var(--brass);}
  .goal-edit-form{flex:1;display:flex;gap:6px;}
  .goal-edit-form input{flex:1;background:var(--ink);border:1px solid var(--line);color:var(--paper);padding:6px 10px;border-radius:6px;font-size:0.85rem;}
  .goal-edit-form button{background:var(--brass);color:var(--ink);border:none;padding:6px 10px;border-radius:6px;font-weight:600;cursor:pointer;font-size:0.78rem;}
  .goal-edit-form button.cancel{background:none;border:1px solid var(--line);color:var(--muted);}
  .goal-add{display:flex;gap:6px;margin-top:6px;}
  .goal-add input{flex:1;background:var(--panel-raised);border:1px solid var(--line);color:var(--paper);padding:7px 10px;border-radius:6px;font-size:0.82rem;}
  .goal-add button{background:none;border:1px solid var(--brass);color:var(--brass);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:0.9rem;}
  .goal-add button:hover{background:var(--brass-dim);}
  .empty-goal{color:var(--muted);font-size:0.78rem;font-style:italic;opacity:0.5;}

  /* ---- Calendário ---- */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cal-header button{background:var(--panel);border:1px solid var(--line);color:var(--brass);width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:1rem;}
  .cal-header button:hover{background:var(--brass-dim);}
  #cal-label{font-family:var(--display);font-size:1.15rem;color:var(--paper);text-transform:capitalize;}
  .cal-legend{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .cal-legend span{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .cal-legend .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-weekday{font-family:var(--mono);font-size:0.65rem;color:var(--muted);text-transform:uppercase;text-align:center;padding-bottom:6px;letter-spacing:1px;}
  .cal-day{aspect-ratio:1;background:var(--panel);border-radius:8px;padding:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;border:1px solid transparent;transition:border-color .15s, background .15s;}
  .cal-day:hover{border-color:var(--line);}
  .cal-day.today{border-color:var(--brass);}
  .cal-day.selected{background:var(--brass-dim);border-color:var(--brass);}
  .cal-day.empty{visibility:hidden;cursor:default;}
  .cal-day .num{font-family:var(--mono);font-size:0.75rem;color:var(--paper);}
  .cal-day .dots{display:flex;gap:3px;flex-wrap:wrap;}
  .cal-day .dot{width:6px;height:6px;border-radius:50%;}
  .dot-alta{background:var(--alta);}
  .dot-media{background:var(--media);}
  .dot-baixa{background:var(--baixa);}
  .dot-lembrete{background:var(--lembrete);}
  .cal-hint{color:var(--muted);font-size:0.82rem;font-style:italic;margin-top:20px;}

  .loading{color:var(--muted);font-family:var(--mono);font-size:0.8rem;padding:20px 0;}

  /* ---- header: usuário logado ---- */
  .header-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .user-chip{display:none;align-items:center;gap:10px;font-family:var(--mono);font-size:0.72rem;color:var(--muted);}
  .user-chip button{background:none;border:1px solid var(--line);color:var(--muted);padding:5px 10px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:0.66rem;text-transform:uppercase;letter-spacing:0.5px;}
  .user-chip button:hover{color:var(--alta);border-color:var(--alta);}

  /* ---- login/cadastro ---- */
  body.auth-locked #app-content{display:none;}
  body.auth-locked .auth-overlay{display:flex;}
  .auth-overlay{display:none;position:fixed;inset:0;background:var(--ink);z-index:100;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .auth-modal{background:var(--panel-raised);border:1px solid var(--line);border-radius:10px;padding:32px 28px;width:100%;max-width:360px;}
  .auth-title{font-family:var(--display);font-weight:400;font-size:1.8rem;margin:0 0 4px 0;color:var(--paper);text-align:center;}
  .auth-sub{font-family:var(--mono);font-size:0.7rem;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:1px;margin:0 0 22px 0;}
  .auth-tabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px;}
  .auth-tabs button{flex:1;font-family:var(--mono);font-size:0.7rem;letter-spacing:1px;text-transform:uppercase;background:var(--panel);color:var(--muted);border:none;padding:9px 0;cursor:pointer;}
  .auth-tabs button.active{background:var(--brass-dim);color:var(--brass);}
  #auth-form{display:flex;flex-direction:column;gap:10px;}
  #auth-form input{background:var(--ink);border:1px solid var(--line);color:var(--paper);padding:10px 12px;border-radius:6px;font-family:var(--sans);font-size:0.9rem;width:100%;}
  #auth-form input:focus{outline:none;border-color:var(--brass);}
  .auth-error{color:var(--alta);font-size:0.78rem;min-height:1.1em;}
  #auth-submit{background:var(--brass);color:var(--ink);border:none;padding:10px;border-radius:6px;font-weight:600;cursor:pointer;font-size:0.9rem;margin-top:4px;}
  #auth-submit:hover{background:#DDB434;}
  #auth-submit:disabled{opacity:0.6;cursor:default;}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:0.75rem;}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--line);}
  .auth-google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--paper);color:#1B2226;border:none;padding:10px;border-radius:6px;font-weight:600;cursor:pointer;font-size:0.88rem;}
  .auth-google-btn:hover{background:#fff;}
  .auth-google-btn svg{width:18px;height:18px;flex-shrink:0;}

  /* ---- Calendário: layout lado a lado com painel do dia ---- */
  .cal-layout{display:grid;grid-template-columns:1fr;gap:22px;align-items:start;}
  .cal-main{min-width:0;}
  .cal-panel{display:none;background:var(--panel-raised);border:1px solid var(--line);border-radius:10px;padding:18px;position:relative;}
  .cal-panel.open{display:block;}
  .cal-panel-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;}
  .cal-panel-close:hover{color:var(--alta);}
  #cal-panel-title{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:0 22px 16px 0;color:var(--paper);text-transform:capitalize;}
  @media(min-width:960px){
    .cal-layout{grid-template-columns:1fr 360px;}
    .cal-panel{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;}
  }

  /* ---- Metas ancoradas em ação ---- */
  .goal-body{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;}
  .goal-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .goal-next{font-family:var(--mono);font-size:0.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;}
  .goal-schedule-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:3px 8px;font-size:0.64rem;cursor:pointer;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap;}
  .goal-schedule-btn:hover{border-color:var(--brass);color:var(--brass);}
</style>
</head>
<body class="auth-locked">
<div class="wrap">
  <header>
    <h1>Agenda</h1>
    <div class="header-right">
      <div class="date" id="today-date"></div>
      <div class="user-chip" id="user-chip">
        <span id="user-email"></span>
        <button id="logout-btn">Sair</button>
      </div>
    </div>
  </header>

  <div id="app-content">
  <nav class="tabs">
    <button class="active" data-tab="hoje">Hoje</button>
    <button data-tab="calendario">Calendário</button>
    <button data-tab="metas">Metas</button>
  </nav>

  <section id="tab-hoje" class="active">
    <div id="unclassified-section" style="display:none;">
      <div class="unclassified-heading">Não classificado</div>
      <div id="unclassified-list"></div>
    </div>
    <div class="add-form">
      <div class="form-context" id="form-context" style="display:none;"></div>
      <input type="date" id="new-date" style="display:none;">
      <input type="time" id="new-time" value="08:00">
      <select id="new-priority">
        <option value="alta">Alta</option>
        <option value="media" selected>Média</option>
        <option value="baixa">Baixa</option>
        <option value="lembrete">Lembrete</option>
      </select>
      <input type="text" id="new-text" placeholder="O que precisa fazer?">
      <button id="add-task-btn">Adicionar</button>
      <button type="button" id="cancel-form-mode" class="cancel" style="display:none;">Cancelar</button>
    </div>
    <div class="focus-toggle-wrap" id="focus-toggle-wrap" style="display:none;">
      <a href="#" id="focus-toggle">ver dia completo</a>
    </div>
    <div class="spine-wrap" id="timeline">
      <div class="loading">Carregando agenda...</div>
    </div>
  </section>

  <section id="tab-calendario">
    <div class="cal-layout">
      <div class="cal-main">
        <div class="cal-header">
          <button id="cal-prev">‹</button>
          <span id="cal-label"></span>
          <button id="cal-next">›</button>
        </div>
        <div class="cal-legend">
          <span><i class="dot dot-alta"></i>Alta</span>
          <span><i class="dot dot-media"></i>Média</span>
          <span><i class="dot dot-baixa"></i>Baixa</span>
          <span><i class="dot dot-lembrete"></i>Lembrete</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-hint" id="cal-hint">Clique em um dia para ver ou anotar compromissos.</div>
      </div>
      <div class="cal-panel" id="cal-panel">
        <button class="cal-panel-close" id="cal-panel-close">×</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const firebaseConfig = {

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);

const STORAGE_KEY = 'agenda-data';
let data = { tasks: [], goals: { longo: [], medio: [], curto: [] } };
let calDate = new Date();
let selectedDay = null;
let currentUser = null;
let unsubSnapshot = null;
let editingTaskId = null;
let editingGoal = null; // { key, id }
let formMode = null; // { type: 'classify', taskId } | { type: 'goal-link', goalId, goalKey }
let focusMode = localStorage.getItem('agenda-focus-mode');
focusMode = focusMode === null ? true : focusMode === 'on';

const PRIORITIES = ['alta','media','baixa','lembrete'];

const dateEl = document.getElementById('today-date');
dateEl.textContent = new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatDateShort(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
}

const SEVEN_DAYS_MS = 7*24*60*60*1000;

// Próxima tarefa futura (ou de hoje), não concluída, vinculada a essa meta.
function nextStepFor(goalId){
  const candidates = data.tasks.filter(t => t.goal_id === goalId && !t.done && t.date && t.date >= todayStr());
  if(candidates.length === 0) return null;
  candidates.sort((a,b)=> a.date === b.date ? a.time.localeCompare(b.time) : a.date.localeCompare(b.date));
  return candidates[0];
}

// Meta sem próximo passo há mais de 7 dias desde a criação: sobe para o topo da coluna (só na exibição).
function needsBoost(g){
  return !nextStepFor(g.id) && (Date.now() - g.created > SEVEN_DAYS_MS);
}

// Cache local (rascunho instantâneo + fallback offline). O Firestore é a fonte de verdade quando logado.
function loadLocalCache(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      data.tasks = parsed.tasks || [];
      data.goals = parsed.goals || { longo: [], medio: [], curto: [] };
    }
  }catch(e){
    console.log('Nenhum dado salvo ainda, começando do zero.');
  }
  migrateData();
}

// Preenche campos novos (goal_id, created) em dados salvos antes dessas funcionalidades existirem.
// Importante: usa "=== undefined" (não "!t.date") para não confundir tarefa antiga (sem campo)
// com tarefa intencionalmente não classificada (date explicitamente null).
function migrateData(){
  data.tasks.forEach(t=>{
    if(t.date === undefined) t.date = todayStr();
    if(t.time === undefined) t.time = null;
    if(t.priority === undefined) t.priority = null;
    if(t.goal_id === undefined) t.goal_id = null;
  });
  ['longo','medio','curto'].forEach(key=>{
    (data.goals[key] || []).forEach(g=>{
      if(g.created === undefined) g.created = 0;
    });
  });
}

function saveLocalCache(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ console.error('Erro ao salvar cache local:', e); }
}

function renderAll(){
  renderUnclassified();
  renderTimeline('timeline', todayStr());
  renderGoals();
  renderCalendar();
  if(selectedDay){ renderTimeline('cal-timeline', selectedDay); }
}

async function save(){
  saveLocalCache();
  if(currentUser){
    try{
      await setDoc(doc(db, 'users', currentUser.uid), data);
    }catch(e){
      console.error('Erro ao sincronizar com a nuvem (dados mantidos localmente):', e);
    }
  }
}

// ---- Autenticação ----
function subscribeUser(uidStr){
  if(unsubSnapshot) unsubSnapshot();
  const ref = doc(db, 'users', uidStr);
  unsubSnapshot = onSnapshot(ref, snap=>{
    if(snap.exists()){
      const remote = snap.data();
      data.tasks = remote.tasks || [];
      data.goals = remote.goals || { longo: [], medio: [], curto: [] };
      migrateData();
      saveLocalCache();
    }else{
      // primeiro login nesta conta: usa o que já existe localmente (se houver) como ponto de partida
      setDoc(ref, data).catch(e=>console.error('Erro ao criar documento inicial:', e));
    }
    renderAll();
  }, err=>{
    console.error('Erro na sincronização em tempo real:', err);
  });
}

function unsubscribeUser(){
  if(unsubSnapshot){ unsubSnapshot(); unsubSnapshot = null; }
}

function translateAuthError(code){
  const map = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/user-not-found': 'Usuário não encontrado.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Este e-mail já está cadastrado.',
    'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
    'auth/popup-closed-by-user': 'Login cancelado.',
    'auth/network-request-failed': 'Falha de rede. Verifique sua conexão.',
  };
  return map[code] || 'Não foi possível entrar. Tente novamente.';
}

onAuthStateChanged(auth, user=>{
  currentUser = user;
  const chip = document.getElementById('user-chip');
  if(user){
    document.body.classList.remove('auth-locked');
    chip.style.display = 'flex';
    document.getElementById('user-email').textContent = user.email || user.displayName || '';
    subscribeUser(user.uid);
  }else{
    document.body.classList.add('auth-locked');
    chip.style.display = 'none';
    unsubscribeUser();
  }
});

let authMode = 'login';
const authForm = document.getElementById('auth-form');
const authEmail = document.getElementById('auth-email');
const authPassword = document.getElementById('auth-password');

document.querySelectorAll('.auth-tab').forEach(btn=>{

    btn.classList.add('active');

    authSubmit.textContent = authMode === 'login' ? 'Entrar' : 'Criar conta';
    authError.textContent = '';

});

authForm.addEventListener('submit', async e=>{
  e.preventDefault();
  authError.textContent = '';
  authSubmit.disabled = true;
  const email = authEmail.value.trim();
  const password = authPassword.value;
  try{
    if(authMode === 'login'){
      await signInWithEmailAndPassword(auth, email, password);
    }else{
      await createUserWithEmailAndPassword(auth, email, password);
    }

    authError.textContent = translateAuthError(err.code);

    authSubmit.disabled = false;

document.getElementById('auth-google').addEventListener('click', async ()=>{
  authError.textContent = '';
  try{
    await signInWithPopup(auth, new GoogleAuthProvider());

    authError.textContent = translateAuthError(err.code);

document.getElementById('logout-btn').addEventListener('click', ()=>{
  signOut(auth);
});

// Markup de um task-card isolado, reaproveitado tanto na spine normal quanto no card de foco.
function taskCardMarkup(t){
  if(editingTaskId === t.id){
    return `
      <div class="task-card editing" data-id="${t.id}">
        <div class="task-edit-form">
          <input type="time" class="edit-time" value="${t.time}">
          <select class="edit-priority">
            ${PRIORITIES.map(p=>`<option value="${p}" ${p===t.priority?'selected':''}>${p.charAt(0).toUpperCase()+p.slice(1)}</option>`).join('')}
          </select>
          <input type="text" class="edit-text" value="${escapeHtml(t.text)}">
          <button class="save-edit">Salvar</button>
          <button type="button" class="cancel cancel-edit">Cancelar</button>
        </div>
      </div>
    `;
  }
  return `
    <div class="task-card p-${t.priority} ${t.done?'done':''}" data-id="${t.id}">
      <input type="checkbox" ${t.done?'checked':''} class="task-check">
      <span class="txt">${escapeHtml(t.text)}</span>
      <span class="tag">${t.priority}</span>
      <button class="edit task-edit">✎</button>
      <button class="del task-del">×</button>
    </div>
  `;
}

function renderSpineInto(container, sortedTasks){
  const spine = document.createElement('div');
  spine.className = 'spine-line';
  container.appendChild(spine);
  sortedTasks.forEach(t=>{
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.innerHTML = `
      <div class="time">${t.time}</div>
      <div class="tick"></div>
      ${taskCardMarkup(t)}
    `;
    container.appendChild(slot);
  });
}

// Escolhe a tarefa em destaque no modo Foco: a próxima pendente por horário (ou, se todas
// as pendentes já passaram do horário atual, a mais recente entre as atrasadas).
function getFocusTask(dateStr){
  const now = `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
  const undone = data.tasks.filter(t => t.date === dateStr && !t.done && t.time);
  if(undone.length === 0) return null;
  const upcoming = undone.filter(t => t.time >= now).sort((a,b)=> a.time.localeCompare(b.time));
  if(upcoming.length) return upcoming[0];
  return [...undone].sort((a,b)=> b.time.localeCompare(a.time))[0];
}

function renderTimeline(containerId, dateStr){
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';

  const isHojeFocusable = containerId === 'timeline' && dateStr === todayStr();
  const toggleWrap = document.getElementById('focus-toggle-wrap');
  if(toggleWrap){
    toggleWrap.style.display = isHojeFocusable ? 'block' : 'none';
    if(isHojeFocusable){
      document.getElementById('focus-toggle').textContent = focusMode ? 'ver dia completo' : 'voltar ao foco';
    }
  }

  const dayTasks = data.tasks.filter(t => t.date === dateStr);
  if(dayTasks.length === 0){
    wrap.innerHTML = '<div class="empty-slot">Nada anotado para este dia ainda.</div>';
    return;
  }
  const sorted = [...dayTasks].sort((a,b)=> a.time.localeCompare(b.time));

  const focusTask = (isHojeFocusable && focusMode) ? getFocusTask(dateStr) : null;

  if(focusTask){
    const focusWrap = document.createElement('div');
    focusWrap.className = 'focus-card';
    focusWrap.innerHTML = `
      <div class="focus-label">Foco agora <span class="focus-time">${focusTask.time}</span></div>
      ${taskCardMarkup(focusTask)}
    `;
    wrap.appendChild(focusWrap);

    const rest = sorted.filter(t => t.id !== focusTask.id);
    if(rest.length){
      const restWrap = document.createElement('div');
      restWrap.className = 'timeline-rest';
      wrap.appendChild(restWrap);
      renderSpineInto(restWrap, rest);
    }
  }else{
    renderSpineInto(wrap, sorted);
  }

  wrap.querySelectorAll('.task-check').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const id = e.target.closest('.task-card').dataset.id;
      const task = data.tasks.find(t=>t.id===id);
      if(task){ task.done = e.target.checked; save(); renderTimeline(containerId, dateStr); renderCalendar(); }
    });
  });
  wrap.querySelectorAll('.task-del').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.closest('.task-card').dataset.id;
      data.tasks = data.tasks.filter(t=>t.id!==id);
      save(); renderTimeline(containerId, dateStr); renderCalendar();
    });
  });
  wrap.querySelectorAll('.task-edit').forEach(btn=>{
    btn.addEventListener('click', e=>{
      editingTaskId = e.target.closest('.task-card').dataset.id;
      renderTimeline(containerId, dateStr);
    });
  });
  wrap.querySelectorAll('.edit-text').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key === 'Enter') e.target.closest('.task-card').querySelector('.save-edit').click();
      if(e.key === 'Escape') e.target.closest('.task-card').querySelector('.cancel-edit').click();
    });
  });
  wrap.querySelectorAll('.cancel-edit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingTaskId = null;
      renderTimeline(containerId, dateStr);
    });
  });
  wrap.querySelectorAll('.save-edit').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const card = e.target.closest('.task-card');
      const id = card.dataset.id;
      const task = data.tasks.find(t=>t.id===id);
      const newTime = card.querySelector('.edit-time').value;
      const newText = card.querySelector('.edit-text').value.trim();
      const newPriority = card.querySelector('.edit-priority').value;
      if(task && newText && newTime){
        task.time = newTime; task.text = newText; task.priority = newPriority;
      }
      editingTaskId = null;
      save(); renderTimeline(containerId, dateStr); renderCalendar();
    });
  });
}

function addTask(dateStr, time, priority, text, goalId){
  if(!text || !time) return;
  data.tasks.push({ id: uid(), date: dateStr, time, priority, text, done:false, goal_id: goalId || null });
  save();
}

// ---- Não classificado (captura rápida) + vínculo de meta: ambos reaproveitam o add-form
// da aba Hoje, alternando seu modo via `formMode` em vez de duplicar formulários.
function exitFormMode(){
  formMode = null;
  document.getElementById('new-date').style.display = 'none';
  document.getElementById('add-task-btn').textContent = 'Adicionar';
  document.getElementById('cancel-form-mode').style.display = 'none';
  document.getElementById('form-context').style.display = 'none';
  document.getElementById('form-context').textContent = '';
  document.getElementById('new-text').placeholder = 'O que precisa fazer?';
}

function switchToHoje(){
  document.querySelector('nav.tabs button[data-tab="hoje"]').click();
}

function startClassify(taskId){
  const t = data.tasks.find(x=>x.id===taskId);
  if(!t) return;
  formMode = { type:'classify', taskId };
  document.getElementById('new-date').style.display = 'inline-block';
  document.getElementById('new-date').value = todayStr();
  document.getElementById('new-time').value = '08:00';
  document.getElementById('new-priority').value = 'media';
  document.getElementById('new-text').value = t.text;
  document.getElementById('add-task-btn').textContent = 'Salvar classificação';
  document.getElementById('cancel-form-mode').style.display = 'inline-block';
  const ctx = document.getElementById('form-context');
  ctx.textContent = 'Classificando item da captura rápida.';
  ctx.style.display = 'block';
  document.getElementById('new-text').focus();
}

function startGoalLink(goalId, goalKey){
  const goal = data.goals[goalKey].find(g=>g.id===goalId);
  formMode = { type:'goal-link', goalId, goalKey };
  switchToHoje();
  document.getElementById('new-date').style.display = 'inline-block';
  document.getElementById('new-date').value = todayStr();
  document.getElementById('new-time').value = '08:00';
  document.getElementById('new-priority').value = 'media';
  document.getElementById('new-text').value = '';
  document.getElementById('new-text').placeholder = 'Próximo passo...';
  document.getElementById('add-task-btn').textContent = 'Salvar próximo passo';
  document.getElementById('cancel-form-mode').style.display = 'inline-block';
  const ctx = document.getElementById('form-context');
  ctx.textContent = goal ? `Agendando próximo passo para: "${goal.text}"` : 'Agendando próximo passo';
  ctx.style.display = 'block';
  document.getElementById('new-text').focus();
}

document.getElementById('cancel-form-mode').addEventListener('click', ()=>{
  exitFormMode();
});

document.getElementById('add-task-btn').addEventListener('click', ()=>{
  const time = document.getElementById('new-time').value;
  const priority = document.getElementById('new-priority').value;
  const textEl = document.getElementById('new-text');
  const text = textEl.value.trim();

  if(formMode && formMode.type === 'classify'){
    const dateVal = document.getElementById('new-date').value || todayStr();
    const t = data.tasks.find(x=>x.id===formMode.taskId);
    if(t && text && time){
      t.date = dateVal; t.time = time; t.priority = priority; t.text = text;
      exitFormMode();
      save(); renderAll();
    }
    return;
  }
  if(formMode && formMode.type === 'goal-link'){
    const dateVal = document.getElementById('new-date').value || todayStr();
    if(text && time){
      addTask(dateVal, time, priority, text, formMode.goalId);
      exitFormMode();
      renderAll();
    }
    return;
  }

  addTask(todayStr(), time, priority, text);
  textEl.value = '';
  renderTimeline('timeline', todayStr());
  renderCalendar();
});
document.getElementById('new-text').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('add-task-btn').click();
});

// ---- Não classificado ----
function renderUnclassified(){
  const section = document.getElementById('unclassified-section');
  const list = document.getElementById('unclassified-list');
  const items = data.tasks.filter(t => !t.date);
  if(items.length === 0){
    section.style.display = 'none';
    list.innerHTML = '';
    return;
  }
  section.style.display = 'block';
  list.innerHTML = '';
  items.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'unclassified-card';
    card.dataset.id = t.id;
    card.innerHTML = `
      <span class="txt">${escapeHtml(t.text)}</span>
      <button class="classify-btn">Classificar</button>
      <button class="unclassified-del">×</button>
    `;
    list.appendChild(card);
  });
  list.querySelectorAll('.classify-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      startClassify(e.target.closest('.unclassified-card').dataset.id);
    });
  });
  list.querySelectorAll('.unclassified-del').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const id = e.target.closest('.unclassified-card').dataset.id;
      data.tasks = data.tasks.filter(t=>t.id!==id);
      save(); renderUnclassified(); renderCalendar();
    });
  });
}

// ---- Captura rápida (FAB) ----
const qcOverlay = document.getElementById('qc-overlay');
const qcText = document.getElementById('qc-text');
document.getElementById('quick-capture-fab').addEventListener('click', ()=>{
  qcOverlay.classList.add('open');
  qcText.value = '';
  qcText.focus();
});
document.getElementById('qc-cancel').addEventListener('click', ()=>{
  qcOverlay.classList.remove('open');
});
qcOverlay.addEventListener('click', e=>{
  if(e.target === qcOverlay) qcOverlay.classList.remove('open');
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && qcOverlay.classList.contains('open')) qcOverlay.classList.remove('open');
});
document.getElementById('qc-form').addEventListener('submit', e=>{
  e.preventDefault();
  const text = qcText.value.trim();
  if(!text) return;
  data.tasks.push({ id: uid(), date: null, time: null, priority: null, text, done:false, goal_id: null });
  save();
  qcOverlay.classList.remove('open');
  renderUnclassified();
  renderCalendar();
});

// ---- Foco do dia ----
document.getElementById('focus-toggle').addEventListener('click', e=>{
  e.preventDefault();
  focusMode = !focusMode;
  localStorage.setItem('agenda-focus-mode', focusMode ? 'on' : 'off');
  renderTimeline('timeline', todayStr());
});

document.getElementById('cal-add-task-btn').addEventListener('click', ()=>{
  if(!selectedDay) return;
  const time = document.getElementById('cal-new-time').value;
  const priority = document.getElementById('cal-new-priority').value;
  const textEl = document.getElementById('cal-new-text');
  const text = textEl.value.trim();
  addTask(selectedDay, time, priority, text);
  textEl.value = '';
  renderTimeline('cal-timeline', selectedDay);
  renderCalendar();
});
document.getElementById('cal-new-text').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('cal-add-task-btn').click();
});

// ---- Metas ----
function renderGoals(){
  ['longo','medio','curto'].forEach(key=>{
    const el = document.getElementById('goals-'+key);
    const list = data.goals[key];
    el.innerHTML = '';
    if(list.length === 0){
      el.innerHTML = '<div class="empty-goal">Nenhuma meta ainda.</div>';
      return;
    }
    // Reordenação silenciosa (só na exibição, não mexe na ordem salva): metas sem
    // próximo passo há mais de 7 dias sobem para o topo. Sort estável preserva o
    // resto da ordem original dentro de cada grupo.
    const displayList = list.slice().sort((a,b)=> (needsBoost(b)?1:0) - (needsBoost(a)?1:0));

    displayList.forEach(g=>{
      const item = document.createElement('div');
      const isEditing = editingGoal && editingGoal.key === key && editingGoal.id === g.id;
      if(isEditing){
        item.className = 'goal-item editing';
        item.innerHTML = `
          <div class="goal-edit-form">
            <input type="text" class="edit-goal-text" value="${escapeHtml(g.text)}" data-id="${g.id}" data-key="${key}">
            <button class="save-goal-edit" data-id="${g.id}" data-key="${key}">Salvar</button>
            <button type="button" class="cancel cancel-goal-edit">Cancelar</button>
          </div>
        `;
      }else{
        const next = nextStepFor(g.id);
        const nextLabel = next ? `Próximo: ${formatDateShort(next.date)}` : 'Sem próximo passo';
        item.className = 'goal-item' + (g.done ? ' done':'');
        item.innerHTML = `
          <input type="checkbox" ${g.done?'checked':''} data-id="${g.id}" data-key="${key}" class="goal-check">
          <div class="goal-body">
            <span class="txt">${escapeHtml(g.text)}</span>
            <div class="goal-meta">
              <span class="goal-next">${nextLabel}</span>
              <button class="goal-schedule-btn" data-id="${g.id}" data-key="${key}">+ Agendar próximo passo</button>
            </div>
          </div>
          <button class="edit goal-edit" data-id="${g.id}" data-key="${key}">✎</button>
          <button class="del goal-del" data-id="${g.id}" data-key="${key}">×</button>
        `;
      }
      el.appendChild(item);
    });
  });

  document.querySelectorAll('.goal-check').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const { id, key } = e.target.dataset;
      const g = data.goals[key].find(x=>x.id===id);
      if(g){ g.done = e.target.checked; save(); renderGoals(); }
    });
  });
  document.querySelectorAll('.goal-del').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const { id, key } = e.target.dataset;
      data.goals[key] = data.goals[key].filter(x=>x.id!==id);
      save(); renderGoals();
    });
  });
  document.querySelectorAll('.goal-edit').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const { id, key } = e.target.dataset;
      editingGoal = { key, id };
      renderGoals();
    });
  });
  document.querySelectorAll('.goal-schedule-btn').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const { id, key } = e.target.dataset;
      startGoalLink(id, key);
    });
  });
  document.querySelectorAll('.edit-goal-text').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key === 'Enter') e.target.closest('.goal-edit-form').querySelector('.save-goal-edit').click();
      if(e.key === 'Escape') e.target.closest('.goal-edit-form').querySelector('.cancel-goal-edit').click();
    });
  });
  document.querySelectorAll('.cancel-goal-edit').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      editingGoal = null;
      renderGoals();
    });
  });
  document.querySelectorAll('.save-goal-edit').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const { id, key } = e.target.dataset;
      const input = document.querySelector(`.edit-goal-text[data-id="${id}"][data-key="${key}"]`);
      const newText = input.value.trim();
      const g = data.goals[key].find(x=>x.id===id);
      if(g && newText){ g.text = newText; }
      editingGoal = null;
      save(); renderGoals();
    });
  });
}

document.querySelectorAll('[data-list]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const key = btn.dataset.list;
    const input = document.getElementById('input-'+key);
    const text = input.value.trim();
    if(!text) return;
    data.goals[key].push({ id: uid(), text, done:false, created: Date.now() });
    input.value = '';
    save(); renderGoals();
  });
});
document.querySelectorAll('.goal-add input').forEach(inp=>{
  inp.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){
      const key = inp.id.replace('input-','');
      document.querySelector(`[data-list="${key}"]`).click();
    }
  });
});

// ---- Calendário ----
function renderCalendar(){
  const y = calDate.getFullYear(), m = calDate.getMonth();
  document.getElementById('cal-label').textContent = calDate.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].forEach(w=>{
    const wd = document.createElement('div');
    wd.className = 'cal-weekday';
    wd.textContent = w;
    grid.appendChild(wd);
  });

  const firstDayOffset = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const tStr = todayStr();

  for(let i=0;i<firstDayOffset;i++){
    const empty = document.createElement('div');
    empty.className = 'cal-day empty';
    grid.appendChild(empty);
  }

  for(let d=1; d<=daysInMonth; d++){
    const key = `${y}-${pad(m+1)}-${pad(d)}`;
    const cell = document.createElement('div');
    let cls = 'cal-day';
    if(key === tStr) cls += ' today';
    if(key === selectedDay) cls += ' selected';
    cell.className = cls;

    const cats = [...new Set(data.tasks.filter(t=>t.date===key).map(t=>t.priority))];
    const order = ['alta','media','baixa','lembrete'];
    const dots = order.filter(c=>cats.includes(c)).map(c=>`<span class="dot dot-${c}"></span>`).join('');

    cell.innerHTML = `<span class="num">${d}</span><div class="dots">${dots}</div>`;
    cell.addEventListener('click', ()=>{
      selectedDay = key;
      renderCalendar();
      showDayDetail(key);
    });
    grid.appendChild(cell);
  }
}

function showDayDetail(dateStr){
  const panel = document.getElementById('cal-panel');
  const hint = document.getElementById('cal-hint');
  panel.classList.add('open');
  hint.style.display = 'none';
  const dObj = new Date(dateStr + 'T00:00:00');
  document.getElementById('cal-panel-title').textContent = dObj.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
  renderTimeline('cal-timeline', dateStr);
}

function closeDayDetail(){
  selectedDay = null;
  document.getElementById('cal-panel').classList.remove('open');
  document.getElementById('cal-hint').style.display = 'block';
  renderCalendar();
}
document.getElementById('cal-panel-close').addEventListener('click', closeDayDetail);

document.getElementById('cal-prev').addEventListener('click', ()=>{
  calDate = new Date(calDate.getFullYear(), calDate.getMonth()-1, 1);
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', ()=>{
  calDate = new Date(calDate.getFullYear(), calDate.getMonth()+1, 1);
  renderCalendar();
});

// ---- Tabs ----
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

// Mostra o cache local imediatamente (instantâneo, mesmo antes do Firebase responder).
// Quando o login resolver, subscribeUser() assume o Firestore como fonte de verdade.
loadLocalCache();
renderAll();

// Registra o service worker (permite instalar como app e funcionar offline)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(err=>console.log('SW falhou:', err));
  });
}
